name: preflight
description: Run the fixed Python preflight battery against the consumer repo

inputs:
  ref:
    description: Checkout ref for the consumer repo (empty = event default)
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        clean: false
        persist-credentials: false

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - shell: bash
      run: uvx --from .python-devkit preflight-python
