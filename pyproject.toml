[project]
name = "python-devkit"
version = "0.0.0.dev0"
description = "Python repo-lifecycle tooling: workspace locking, preflight checks, canonical ruff configuration"
requires-python = ">=3.13"
dependencies = [
    "bashrun>=0.1.0",
    "ci-devkit>=0.1.0",
    "pydantic>=2.11.7",
    "typer>=0.17.4",
]

[project.scripts]
lock-python = "python_devkit.lock_python:app"
preflight-python = "python_devkit.preflight:app"
sync-ruff = "python_devkit.sync_ruff:app"

[dependency-groups]
dev = ["basedpyright>=1.39.10", "pytest>=8.0.0", "ruff>=0.14.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_devkit"]
include = ["src/python_devkit/py.typed", "src/python_devkit/ruff.base.toml"]

[tool.uv.sources]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src"]
