[project]
name = "python-devkit"
version = "0.0.0.dev0"
description = "Python repo-lifecycle tooling: workspace locking, preflight checks, canonical ruff configuration"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["basedpyright>=1.39.10", "ruff>=0.14.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_devkit"]
include = ["src/python_devkit/py.typed"]

[tool.uv.sources]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src"]
